services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    plan: free
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_KEYS
        generateValue: true
      - key: LINKEDIN_LI_AT
        sync: false
      - key: LINKEDIN_JSESSIONID
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SCRAPE_CONCURRENCY
        value: "2"
      - key: SCRAPE_QUEUE_MAX
        value: "20"
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: CACHE_MAX_VALUE_BYTES
        value: "524288"
